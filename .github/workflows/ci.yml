name: CI

on:
  push:
    branches: [main, "feat/**", "docs/**", "chore/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentiment-api .
      - name: Start container
        run: docker run -d --name api -p 8000:8000 sentiment-api
      - name: Check /health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health | grep -q '"model_loaded":true' || { docker logs api; exit 1; }
      - name: Check /predict
        run: |
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "I love this so much, best day ever!"}' | tee /dev/stderr | grep -q '"Positive"'
